name: charmed-mysql
base: core26
version: '8.4.10'
summary: MySQL server in a snap.
description: |
  The MySQL software delivers a very fast, multithreaded, multi-user,
  and robust SQL (Structured Query Language) database server. MySQL
  Server is intended for mission-critical, heavy-load production
  systems as well as for embedding into mass-deployed software.
title: Charmed MySQL
contact: https://matrix.to/#/#charmhub-data-platform:ubuntu.com
issues: https://github.com/canonical/charmed-mysql-snap/issues
source-code: https://github.com/canonical/charmed-mysql-snap
website: https://canonical.com/data/mysql

platforms:
  amd64:
  arm64:
  s390x:
grade: stable
confinement: strict
license: Apache-2.0

system-usernames:
  snap_daemon: shared

package-repositories:
  - type: apt
    ppa: data-platform/mysql-shell-8.4
  - type: apt
    ppa: data-platform/mysql-server-plugins-8.4

layout:
  /var/lib/mysql-files:
    bind: $SNAP_COMMON/var/lib/mysql-files
  /usr/lib/mysqlrouter:
    symlink: $SNAP/usr/lib/mysqlrouter
  /usr/lib/mysql-router:
    symlink: $SNAP/usr/lib/mysql-router
  /etc/mysqlrouter:
    symlink: $SNAP_DATA/etc/mysqlrouter
  /var/lib/mysqlrouter:
    symlink: $SNAP_DATA/var/lib/mysqlrouter
  /var/log/mysqlrouter:
    symlink: $SNAP_COMMON/var/log/mysqlrouter
  /var/log/mysqlsh:
    bind: $SNAP_COMMON/var/log/mysqlsh
  /usr/lib/mysqlsh:
    bind: $SNAP/lib/mysqlsh

hooks:
  install:
    plugs:
      - network
      - network-bind
  configure:
    plugs:
      - network

slots:
  logs:
    interface: content
    source:
      read:
        - $SNAP_COMMON/var/log/mysql
        - $SNAP_COMMON/var/log/mysqlrouter
  mysqlrouter-sockets:
    interface: content
    content: socket-directory
    write:
      - $SNAP_COMMON/run/mysqlrouter

apps:
  mysql:
    command: usr/bin/mysql
    plugs:
      - network
  mysqld:
    command: start-mysqld.sh
    daemon: simple
    install-mode: disable
    plugs:
      - network
      - network-bind
  mysqld-initialize:
    command: initialize-mysqld.sh
  mysqlsh:
    command: run-mysqlsh.sh
    plugs:
      - network
  mysqlbinlog:
    command: usr/bin/mysqlbinlog
  mysqlrouter:
    command: run-mysql-router.sh
    plugs:
      - network
  mysqlrouter-service:
    command: start-mysql-router.sh
    daemon: simple
    install-mode: disable
    plugs:
      - network
      - network-bind
  xtrabackup:
    command: run-xtrabackup.sh
  xbcloud:
    command: run-xbcloud.sh
    plugs:
      - network
  xbstream:
    command: run-xbstream.sh
  mysqld-exporter:
    command: start-mysqld-exporter.sh
    daemon: simple
    install-mode: disable
    plugs:
      - network
      - network-bind
  mysqlrouter-exporter:
    command: start-mysql-router-exporter.sh
    daemon: simple
    install-mode: disable
    plugs:
      - network
      - network-bind
  mysqlrouter-passwd:
    command: run-mysql-router-password.sh

parts:
  packages-deb:
    plugin: nil
    stage-packages:
      - mysql-server=8.4.10-0ubuntu0.26.04.1
      - mysql-router=8.4.10-0ubuntu0.26.04.1
      - mysql-shell=8.4.10+dfsg-0ubuntu0.26.04.1~ppa1
      - prometheus-mysqld-exporter=0.18.0-1
      - prometheus-mysqlrouter-exporter=6.0.1-1
      - percona-xtrabackup=8.4.0-5-0ubuntu1
      - mysql-audit-log-filter-plugin=8.4.8+ds-0ubuntu0.26.04.2~ppa1
      - mysql-audit-log-plugin=8.4.8+ds-0ubuntu0.26.04.2~ppa1
      - mysql-auth-ldap-plugin=8.4.8+ds-0ubuntu0.26.04.2~ppa1
      - mysql-binlog-utils-udf-plugin=8.4.8+ds-0ubuntu0.26.04.2~ppa1
      - util-linux
    prime:
      # Mute lint by removing unnecessary MySQL libs
      # which are shipped as APT packages
      - -usr/lib/*/libevent-2.1.so*
      - -usr/lib/*/libkdb5.so*
      - -usr/lib/*/libgmpxx.so*
      - -usr/lib/*/libgnutls-dane.so*
      - -usr/lib/*/libgnutls-openssl.so*
      - -usr/lib/*/libkadm5*
      - -usr/lib/*/libgmpxx.so*
      - -usr/lib/*/libgssrpc.so*
      - -usr/lib/*/libicuio.so*
      - -usr/lib/*/libicutest.so*
      - -usr/lib/*/libicutu.so*
      - -usr/lib/*/libprofiler.so*
      - -usr/lib/*/libtcmalloc_*
      - -usr/lib/*/libunbound.so*
      - -usr/lib/*/libunwind-coredump.so*
      - -usr/lib/*/libunwind-ptrace.so*
      - -usr/lib/*/libunwind-x86_64.so*
    organize:
      usr/share/doc/mysql-server/copyright: licenses/COPYRIGHT-mysql-server
      usr/share/doc/mysql-router/LICENSE.router.gz: licenses/LICENSE-mysql-router
      usr/share/doc/mysqlsh/LICENSE.gz: licenses/LICENSE-mysql-shell
      usr/share/doc/prometheus-mysqld-exporter/copyright: licenses/COPYRIGHT-prometheus-mysqld-exporter
      usr/share/doc/prometheus-mysqlrouter-exporter/copyright: licenses/COPYRIGHT-prometheus-mysqlrouter-exporter
      usr/share/doc/percona-xtrabackup/LICENSE.gz: licenses/LICENSE-percona-xtrabackup
      usr/share/doc/mysql-audit-log-filter-plugin/copyright: licenses/COPYRIGHT-mysql-audit-log-filter-plugin
      usr/share/doc/mysql-audit-log-plugin/copyright: licenses/COPYRIGHT-mysql-audit-log-plugin
      usr/share/doc/mysql-auth-ldap-plugin/copyright: licenses/COPYRIGHT-mysql-auth-ldap-plugin
      usr/share/doc/mysql-binlog-utils-udf-plugin/copyright: licenses/COPYRIGHT-mysql-binlog-utils-udf-plugin
      usr/share/doc/util-linux/copyright: licenses/COPYRIGHT-util-linux
  snap-license:
    plugin: dump
    source: .
    source-type: local
    stage:
      - licenses/LICENSE-snap
    organize:
      LICENSE: licenses/LICENSE-snap
  snap-scripts:
    plugin: dump
    source: snap/local
