name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

jobs:
  promote:
    name: Promote snaps
    uses: canonical/data-platform-workflows/.github/workflows/_promote_snaps.yaml@sinclert/10694/promote-snaps
    with:
      track: '8.0'
      from-risk: edge
      to-risk: beta
      path-to-snap-directory: snap
    secrets:
      snap-store-token: ${{ secrets.SNAP_STORE_TOKEN }}
    permissions:
      actions: read
      contents: write  # Needed to edit GitHub releases

