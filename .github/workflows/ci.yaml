#          SNAP_VERSION=$(yq .version snap/snapcraft.yaml)
#          APT_VERSION=$(apt-cache show mysql-server | awk '/Version: /{print $2; exit}' | cut --delimiter "-" --fields 1)
#          if [ "$SNAP_VERSION" != "$APT_VERSION" ]; then
#              echo "VERSION MISMATCH DETECTED"
#              echo "Snap version: $SNAP_VERSION"
#              echo "APT version: $APT_VERSION"
#              exit 1
#          fi

  build:
    name: Build snap
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v49
    with:
      snapcraft-snap-channel: latest/candidate
    permissions:
      actions: read
      contents: read

  smoke:
    name: Smoke test snap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs:
      - lint
      # - check-version
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install tox
        run: pipx install tox
      - name: Download snap package(s)
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true
      - name: Run tests
        run: tox run -e smoke

  audit-log-plugin:
    name: Audit log plugin test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs:
      - lint
      # - check-version
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install tox
        run: pipx install tox
      - name: Download snap package(s)
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true
      - name: Run tests
        run: tox run -e audit_log
